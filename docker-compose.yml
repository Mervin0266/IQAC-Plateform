# ==============================================================================
# Docker Compose for CHRIST University IQAC Platform (Local Development Backend)
# ==============================================================================
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iqac-backend-dev
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=5000
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@host.docker.internal:5432/iqac_db}
      - DB_SSL=${DB_SSL:-false}
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_must_be_minimum_32_characters_long_for_security}
      - JWT_EXPIRE=${JWT_EXPIRE:-7d}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
      - ENABLE_AUTO_SEED=${ENABLE_AUTO_SEED:-false}
    env_file:
      - path: ./src/app/backend/.env
        required: false
      - path: ./.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s
